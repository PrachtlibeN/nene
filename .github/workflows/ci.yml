name: CI

on:
  pull_request:
  push:
    branches: [main, contracts/foundation]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests tools
      - run: mypy app tools/export_openapi.py
      - run: python -m pytest
        env:
          OLLAMA_MODEL: ci-test-model

  frontend:
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: ci-test-model
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "../backend[dev]"
      - run: npm ci
      - run: npm run typegen
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
